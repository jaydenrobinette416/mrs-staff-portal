<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12294a">
  <title>Calendar Display | Maiden Rescue Squad</title>
  <style>
    :root {
      color: #17243b;
      background: #eef2f7;
      font-family: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 3vw;
      color: white;
      background: #12294a;
    }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); }
    .month-controls { display: flex; align-items: center; gap: 12px; }
    #monthTitle { min-width: 220px; margin: 0; text-align: center; font-size: clamp(20px, 2.8vw, 32px); }
    button {
      min-width: 48px;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: #16345b;
      background: white;
      font: inherit;
      font-size: 22px;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    main { padding: 18px 2vw; }
    #status { padding: 12px; color: #52637a; text-align: center; font-size: 18px; }
    #status.error { color: #842424; }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid #d5deea;
      border-left: 1px solid #d5deea;
      background: white;
    }
    .weekday {
      padding: 10px 6px;
      color: #52637a;
      background: #e3eaf3;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      border-right: 1px solid #d5deea;
      border-bottom: 1px solid #d5deea;
    }
    .day {
      min-width: 0;
      min-height: clamp(105px, calc((100vh - 190px) / 6), 230px);
      padding: 7px;
      border-right: 1px solid #d5deea;
      border-bottom: 1px solid #d5deea;
      overflow-wrap: anywhere;
    }
    .day.outside-month { color: #8995a5; background: #f6f8fb; }
    .day.today { background: #edf5ff; }
    .day-number { margin-bottom: 6px; font-size: 17px; font-weight: 700; }
    .event {
      margin: 5px 0;
      padding: 7px;
      border-radius: 6px;
      background: #e7effb;
      color: #183e6b;
    }
    .event-title { margin: 0; font-size: 15px; line-height: 1.3; font-weight: 700; }
    .event-time { margin: 3px 0 0; color: #52637a; font-size: 13px; }
    .event-description { margin: 5px 0 0; color: #34465e; font-size: 14px; line-height: 1.35; white-space: pre-wrap; }
    @media (max-width: 800px) {
      header { align-items: flex-start; flex-direction: column; }
      .month-controls { width: 100%; justify-content: space-between; }
      #monthTitle { min-width: 0; }
      main { padding: 10px 6px; }
      .weekday { padding: 8px 2px; font-size: 12px; }
      .day { min-height: 100px; padding: 4px; }
      .day-number { font-size: 14px; }
      .event { padding: 4px; }
      .event-title { font-size: 12px; }
      .event-time { font-size: 11px; }
      .event-description { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Maiden Rescue Squad</h1>
    <div class="month-controls">
      <button id="previousMonth" type="button" aria-label="Previous month">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth" type="button" aria-label="Next month">›</button>
    </div>
  </header>
  <main>
    <div id="status" role="status" aria-live="polite">Loading calendar…</div>
    <div id="calendar" class="calendar" aria-label="Monthly event calendar"></div>
  </main>
  <script>
    const API_BASE = "https://api.maidenrescuesquad.org";
    const calendarElement = document.getElementById("calendar");
    const statusElement = document.getElementById("status");
    let displayedYear = new Date().getFullYear();
    let displayedMonth = new Date().getMonth();
    let events = [];
    const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    function dateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function formatTime(value) {
      if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(value || "")) return "";
      const [hour, minute] = value.split(":").map(Number);
      return new Date(2000, 0, 1, hour, minute)
        .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function eventTime(event) {
      if (event.allDay) return "All day";
      const start = formatTime(event.startTime);
      const end = formatTime(event.endTime);
      return start && end ? `${start} – ${end}` : start;
    }

    function renderCalendar() {
      calendarElement.replaceChildren();
      document.getElementById("monthTitle").textContent =
        new Date(displayedYear, displayedMonth, 1).toLocaleDateString(undefined, {
          month: "long",
          year: "numeric"
        });

      for (const weekday of weekdays) {
        const heading = document.createElement("div");
        heading.className = "weekday";
        heading.textContent = weekday;
        calendarElement.appendChild(heading);
      }

      const firstDay = new Date(displayedYear, displayedMonth, 1).getDay();
      const daysInMonth = new Date(displayedYear, displayedMonth + 1, 0).getDate();
      const previousMonthDays = new Date(displayedYear, displayedMonth, 0).getDate();
      const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
      const today = new Date();
      const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

      for (let index = 0; index < totalCells; index++) {
        let year = displayedYear;
        let month = displayedMonth;
        let day;
        let outsideMonth = false;
        if (index < firstDay) {
          day = previousMonthDays - firstDay + index + 1;
          const previous = new Date(displayedYear, displayedMonth, 0);
          year = previous.getFullYear();
          month = previous.getMonth();
          outsideMonth = true;
        } else if (index >= firstDay + daysInMonth) {
          day = index - firstDay - daysInMonth + 1;
          const next = new Date(displayedYear, displayedMonth + 1, 1);
          year = next.getFullYear();
          month = next.getMonth();
          outsideMonth = true;
        } else {
          day = index - firstDay + 1;
        }

        const key = dateKey(year, month, day);
        const cell = document.createElement("section");
        cell.className = "day" + (outsideMonth ? " outside-month" : "") + (key === todayKey ? " today" : "");
        cell.setAttribute("aria-label", `${weekdays[new Date(year, month, day).getDay()]}, ${month + 1}/${day}/${year}`);
        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = day;
        cell.appendChild(number);

        for (const event of events.filter(item => item.dateKey === key)) {
          const item = document.createElement("article");
          item.className = "event";
          const title = document.createElement("h3");
          title.className = "event-title";
          title.textContent = event.title;
          item.appendChild(title);
          const timeText = eventTime(event);
          if (timeText) {
            const time = document.createElement("p");
            time.className = "event-time";
            time.textContent = timeText;
            item.appendChild(time);
          }
          if (event.description) {
            const description = document.createElement("p");
            description.className = "event-description";
            description.textContent = event.description;
            item.appendChild(description);
          }
          cell.appendChild(item);
        }
        calendarElement.appendChild(cell);
      }
    }

    async function loadCalendar() {
      statusElement.className = "";
      statusElement.textContent = "Updating calendar…";
      try {
        const response = await fetch(API_BASE + "/api/display-calendar", {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });
        let result;
        try {
          result = await response.json();
        } catch {
          throw new Error("The calendar service returned an unexpected response.");
        }
        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Unable to load the calendar.");
        }
        events = Array.isArray(result.events) ? result.events : [];
        renderCalendar();
        const count = events.filter(event => {
          const [year, month] = (event.dateKey || "").split("-").map(Number);
          return year === displayedYear && month === displayedMonth + 1;
        }).length;
        statusElement.textContent = `${count} event${count === 1 ? "" : "s"} this month · updates automatically`;
      } catch (error) {
        statusElement.className = "error";
        statusElement.textContent = error.message;
      }
    }

    document.getElementById("previousMonth").addEventListener("click", () => {
      displayedMonth--;
      if (displayedMonth < 0) { displayedMonth = 11; displayedYear--; }
      renderCalendar();
      loadCalendar();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      displayedMonth++;
      if (displayedMonth > 11) { displayedMonth = 0; displayedYear++; }
      renderCalendar();
      loadCalendar();
    });

    loadCalendar();
    window.setInterval(loadCalendar, 60000);
  </script>
</body>
</html>
